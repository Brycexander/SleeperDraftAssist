[project]
name = "sleeper-draft-assistant"
version = "0.1.0"
description = "League-aware Monte Carlo draft recommendations for Sleeper fantasy football"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "polars>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sleeper-draft = "sleeper_draft_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_draft_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
