[project]
name = "sleeper-draft-assistant"
version = "0.1.0"
description = "League-aware Monte Carlo draft recommendations for Sleeper fantasy football"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.116",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "polars>=1.0",
    "requests>=2.32",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sleeper-draft = "sleeper_draft_assistant.cli:main"
sleeper-draft-web = "sleeper_draft_assistant.web:main"

[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.0",
    "cmake>=3.20",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/sleeper_draft_assistant"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
